name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  python:
    runs-on: ubuntu-latest
    env:
      ODDWORLD_DECOMP: ${{ github.workspace }}/../alive_reversing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m compileall -q tools/
      - run: pipx run ruff==0.16.0 check tools/
      # the checkout-probing tests parse the decomp at its pinned revision; AO's path tables come
      # from a commit far below it that a shallow clone would not hold, so both are fetched by SHA
      - run: |
          pins=$(cd tools && python3 -c 'from oddmap.paths import DECOMP_COMMIT, AO_COMMIT; print(DECOMP_COMMIT, AO_COMMIT)')
          read -r pin ao <<< "$pins"
          git init -q "$ODDWORLD_DECOMP"
          git -C "$ODDWORLD_DECOMP" fetch -q --depth 1 https://github.com/AliveTeam/alive_reversing "$pin" "$ao"
          git -C "$ODDWORLD_DECOMP" checkout -q "$pin"
      - run: python3 -m unittest discover -s tools/tests

  browser:
    runs-on: ubuntu-latest
    # Playwright's own image carries the browser build the pinned @playwright/test expects, so nothing
    # is installed here; ci.test.js holds the tag to the pin. The runner's uid keeps the checkout and
    # what the suite writes the runner's files rather than root's
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run test:browser

  deploy:
    needs: [lint, python, browser]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # a deploy in flight is never cancelled; a newer one queued behind it drops the ones between
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          # public/ is the served site; everything else is repo-only
          path: "public"
      - uses: actions/deploy-pages@v5
        id: deployment
